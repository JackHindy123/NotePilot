<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotePilot — Less prep. More learning.</title>
  <meta name="description" content="Turn lecture slides and class notes into flashcards, study guides, and practice exams." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="#/" class="brand"><span class="logo">N</span>NotePilot</a>
      <nav class="nav-links">
        <a href="#/library" data-nav="library">Study materials</a>
        <a href="#/" data-nav="upload">Upload materials</a>
        <a href="#/about" data-nav="about">About</a>
        <span class="pill-badge" title="Everything is stored in this browser only">Local workspace</span>
      </nav>
    </div>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>NotePilot · MGT 103 project by Legally Bankrupt</span>
      <span>Your notes never leave this browser.</span>
    </div>
  </footer>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button class="icon-btn" data-close aria-label="Close">✕</button>
      </div>
      <pre id="modal-body" class="modal-body"></pre>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script src="config.js"></script>
  <script src="generator.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
